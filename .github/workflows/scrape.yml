name: Daily Ranking Scrape
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:     # Enables the manual 'Run workflow' button
jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true # Speeds up subsequent runs even more
          # The version of Python to set UV_PYTHON to
          python-version: "3.14.8"

      - name: Run Scraper with uv
        # 'uv run' will automatically handle dependencies if defined in the script
        run: uv run scrape_arena.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add data/history.json
          git add data/archive.json
          git commit -m "Update rankings: $(date +'%Y-%m-%d')" || exit 0
          git push
