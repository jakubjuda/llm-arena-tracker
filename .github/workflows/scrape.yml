name: Daily Ranking Scrape
on:
  schedule:
    - cron: '15 3 * * *'
  #workflow_dispatch:     # Enables the manual 'Run workflow' button
jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true # Speeds up subsequent runs even more
          # The version of Python to set UV_PYTHON to
          python-version: "3.14.6"

      - name: Run Scraper with uv
        # 'uv run' will automatically handle dependencies if defined in the script
        run: uv run scrape_arena.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add data/history.json
          git add data/archive.json
          git commit -m "Update rankings: $(date +'%Y-%m-%d')" || exit 0
          git push
