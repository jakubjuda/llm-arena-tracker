<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Arena Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>

<body>

    <div class="main-wrapper">
        <div class="chart-card">
            <div class="chart-header">
                <h1>Model Ranking Trends (Elo Score)</h1>
                <button id="masterToggleBtn" class="master-toggle-btn" style="display: none;">Hide All Models</button>
            </div>

            <div id="statusMessage" class="status">Parsing and optimizing trend data...</div>

            <div class="canvas-container">
                <canvas id="eloChart" style="display: none;"></canvas>
            </div>
        </div>
    </div>
    <script src="./js/script.js"></script>

</body>
    
</html>
